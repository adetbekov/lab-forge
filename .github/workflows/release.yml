name: release

# A merge to main that raises VERSION in install_global.py publishes a GitHub release v<version>; the release
# creates the tag through the API (no git identity on the runner). Nothing happens while the tag exists.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version
        id: v
        run: |
          v=$(sed -n 's/^VERSION = "\([^"]*\)"/\1/p' skills/lab-forge/scripts/install_global.py)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Release notes from CHANGELOG
        if: steps.v.outputs.exists == 'false'
        run: |
          awk -v v="${{ steps.v.outputs.version }}" '
            /^## \[/ { on = index($0, "## [" v "]") == 1 } on' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Tag and release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          gh release create "v$v" --target "$GITHUB_SHA" --title "lab-forge v$v" --notes-file notes.md
